name: Publish

on:
  release:
    types: [published]
  # Lets you rehearse a deployment without cutting a GitHub release.
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Publish everything before releasing anything: a build that fails halfway would otherwise
      # leave a partial deployment in the Portal.
      - name: Run tests
        run: ./gradlew build

      - name: Publish to Maven Central
        # publishToMavenCentral (not publishAndReleaseToMavenCentral) uploads the deployment but
        # leaves it PENDING in the Central Portal, so a human confirms before it goes live and
        # becomes permanent. Switch to publishAndRelease once you trust the pipeline.
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
