name: Publish

on:
  release:
    types: [published]
  # Lets you rehearse a deployment without cutting a GitHub release.
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Publish everything before releasing anything: a build that fails halfway would otherwise
      # leave a partial deployment in the Portal.
      - name: Run tests
        run: ./gradlew build

      # A version can only be deployed to Central once; a second attempt fails the whole run. That
      # happens whenever a release is cut for a version that was already deployed by hand, or when
      # this workflow is simply re-run. Skip instead of failing.
      - name: Check whether this version is already on Central
        id: published
        run: |
          VERSION="$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sfI -o /dev/null "https://repo1.maven.org/maven2/io/bordo/ddpclient/$VERSION/ddpclient-$VERSION.pom"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::io.bordo:ddpclient:$VERSION is already on Maven Central — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Maven Central
        if: ${{ steps.published.outputs.exists != 'true' }}
        # publishToMavenCentral (not publishAndReleaseToMavenCentral) uploads the deployment but
        # leaves it PENDING in the Central Portal, so a human confirms before it goes live and
        # becomes permanent. Switch to publishAndRelease once you trust the pipeline.
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
