name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS, not ubuntu: the iosArm64/iosSimulatorArm64/iosX64 targets need Xcode to compile and
    # link, and iosSimulatorArm64Test needs a simulator to run against.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The arm64 macOS runner images do not ship the Android SDK, and the Android target needs it.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test all targets
        run: ./gradlew build

      # Uploaded on failure too -- the suite talks to a real websocket server, so a flake needs the
      # HTML report to diagnose without a local repro.
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
